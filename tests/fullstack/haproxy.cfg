global
    log stdout format raw local0
    maxconn 200

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 10s
    timeout server 10s

resolvers docker_dns
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s

frontend ingress
    bind *:18081
    default_backend telemt_backend

backend telemt_backend
    option tcp-check
    server telemt telemt:18080 check inter 1s fall 2 rise 2 resolvers docker_dns init-addr none

listen statistics
    bind *:8404
    mode http
    stats enable
    stats uri /stats
